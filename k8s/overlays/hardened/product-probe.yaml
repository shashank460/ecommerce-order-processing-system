- op: add
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    tcpSocket: {port: 3001}
    initialDelaySeconds: 5
    periodSeconds: 10
- op: add
  path: /spec/template/spec/containers/0/livenessProbe
  value:
    tcpSocket: {port: 3001}
    initialDelaySeconds: 15
    periodSeconds: 20
