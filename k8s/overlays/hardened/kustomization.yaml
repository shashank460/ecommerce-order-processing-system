apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../namespace.yaml
  - ../../apps.yaml
  - ../../workers.yaml
  - pdb.yaml
  - network-policy.yaml
patches:
  - path: deployment-security-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ".*"
  - path: gateway-probe.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: gateway
  - path: product-probe.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: product
  - path: order-probe.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: order
  - path: inventory-probe.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: inventory
