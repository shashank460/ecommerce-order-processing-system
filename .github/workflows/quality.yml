name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, product, order, inventory, payment, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck ${{ matrix.service }}
        run: npx tsc -p services/${{ matrix.service }}/tsconfig.json --noEmit

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run format:check

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened manifests
        run: kubectl kustomize k8s/overlays/hardened >/tmp/rendered.yaml
      - name: Validate namespace and workloads
        run: grep -q 'kind: Deployment' /tmp/rendered.yaml && grep -q 'kind: NetworkPolicy' /tmp/rendered.yaml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
