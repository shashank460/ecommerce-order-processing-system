services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: bitnami/kafka:3.9
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  gateway:
    build: ./services/gateway
    environment: ["PORT=3000", "JWT_SECRET=${JWT_SECRET}", "PRODUCT_URL=http://product:3001", "ORDER_URL=http://order:3002"]
    ports: ["3000:3000"]
    depends_on: [product, order]
  product:
    build: ./services/product
    environment: ["PORT=3001", "POSTGRES_URL=${POSTGRES_URL}", "REDIS_URL=${REDIS_URL}"]
    depends_on: [postgres, redis]
  order:
    build: ./services/order
    environment: ["PORT=3002", "POSTGRES_URL=${POSTGRES_URL}", "KAFKA_BROKERS=${KAFKA_BROKERS}", "INVENTORY_GRPC=inventory:50051"]
    depends_on: [postgres, kafka, inventory]
  inventory:
    build: ./services/inventory
    environment: ["POSTGRES_URL=${POSTGRES_URL}", "KAFKA_BROKERS=${KAFKA_BROKERS}", "GRPC_PORT=50051"]
    depends_on: [postgres, kafka]
  payment:
    build: ./services/payment
    environment: ["KAFKA_BROKERS=${KAFKA_BROKERS}", "PAYMENT_FAILURE_RATE=0.1"]
    depends_on: [kafka]
  notification:
    build: ./services/notification
    environment: ["KAFKA_BROKERS=${KAFKA_BROKERS}"]
    depends_on: [kafka]
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [gateway]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3003:3000"]
    depends_on: [prometheus]
